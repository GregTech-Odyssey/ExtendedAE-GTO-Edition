plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.86'
    id 'com.gto.gtopublishgradleplugin' version '1.0.27'
    id 'com.diffplug.spotless' version '6.25.0'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = 'extendedae'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

spotless {
    encoding 'UTF-8'
    lineEndings = com.diffplug.spotless.LineEnding.UNIX
    java {
        target 'src/*/java/**/*.java'
        toggleOffOn()
        importOrderFile file('gradle/spotless/spotless.importorder')
        removeUnusedImports()
        endWithNewline()
        eclipse('4.31').configFile file('gradle/spotless/spotless.eclipseformat.xml')
    }
}

legacyForge {

    version = "${minecraft_version}-${forge_version}"

    mods {
        extendedae {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }

        server {
            server()
        }

        gametestWorld {
            client()
            programArguments.addAll("--username", "EAEDev", "--quickPlaySingleplayer", "GametestWorld")
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        gametest {
            type = "gameTestServer"
            gameDirectory = project.file("build/gametest")
        }

    }

}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = "https://gtodyssey.com/maven/releases"
    }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
        authentication {
            header(HttpHeaderAuthentication)
        }
        credentials(HttpHeaderCredentials) {
            name = "x-api-key"
            value = System.getenv('CF_API_KEY')
        }
    }
    maven {
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        name = "Modmaven"
        url = "https://modmaven.dev/"
    }
}

dependencies {
    modImplementation "curse.maven:glodium-957920:5006780"
    modImplementation "appeng:appliedenergistics2-forge-1.20.1:${ae2_version}"
    modImplementation "dev.emi:emi-forge-1.20.1:${emi_version}"
    implementation "com.gto.fastcollection:FastCollection:26.8.7"
    modImplementation "org.appliedenergistics:guideme:20.1.7"
    modCompileOnly "curse.maven:applied-energistics-2-wireless-terminals-459929:5162352"
    modCompileOnly "curse.maven:applied-flux-965012:5329825"
    modCompileOnly "curse.maven:mega-cells-622112:5320730"
    modCompileOnly "curse.maven:jade-324717:4768593"
    // project e
    modCompileOnly "curse.maven:projecte-226410:4901949"
    // Legacy AppliedE overrides AEKey identity methods and is incompatible at runtime with the GTO AE2 fork.
    modCompileOnly "curse.maven:appliede-1009940:5364294"
    // gregtech
    modCompileOnly "curse.maven:gregtechceu-modern-890405:5369020"
    modCompileOnly "curse.maven:ldlib-626676:5394816"
    // immersive engineering
    modCompileOnly "curse.maven:immersive-engineering-231951:5224387"
    annotationProcessor 'org.spongepowered:mixin:0.8.4:processor'
    // runtime test
    modRuntimeOnly "curse.maven:jade-324717:4768593"
    modRuntimeOnly "curse.maven:mega-cells-622112:5320730"
    modRuntimeOnly "curse.maven:projecte-226410:4901949"
    // MEGA Cells requires Cloth Config independently of recipe viewer integration.
    modRuntimeOnly "curse.maven:cloth-config-348521:5729105"

    compileOnly 'org.jetbrains:annotations:24.1.0'
    testCompileOnly 'org.jetbrains:annotations:24.1.0'
}

mixin {
    var refmap = add sourceSets.main, "mixins.epp.refmap.json"
    jar.from refmap
    config "mixins.epp.json"
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'TweakClass'              : "org.spongepowered.asm.launch.MixinTweaker",
                'TweakOrder'              : 0,
                'MixinConfigs'            : "mixins.epp.json"
        ])
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range, ae2_version: ae2_version,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }

    exclude(".cache/**")
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            pom {
                name = project.mod_name
                description = project.mod_description
                url = 'https://github.com/GregTech-Odyssey/ExtendedAE'
                issueManagement {
                    system = 'GitHub'
                    url = 'https://github.com/GregTech-Odyssey/GregTech-Odyssey/issues'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'gtodysseyRepository'
            url = 'https://gtodyssey.com/maven/releases'
            credentials {
                username = findProperty('gtodysseyRepositoryUsername') ?: ''
                password = findProperty('gtodysseyRepositoryPassword') ?: ''
            }
        }
    }
}

gtoPublish {
    publishMaven = true
    publishGithub = false
    publishCurseforge = false
    mavenRepoName = 'gtodysseyRepository'
    mavenRepoUrl = 'releases'
    minecraftVersion = project.minecraft_version
    modLoader = 'Forge'
}

tasks.named('compileJava') {
    dependsOn tasks.named('spotlessCheck')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
